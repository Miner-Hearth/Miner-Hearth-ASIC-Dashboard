notes: >-
  Submitted by the upstream project itself; the image is built from the upstream repository by its own
  GitHub Actions workflow and published to GHCR (linux/amd64 and linux/arm64). One persistent folder
  (APP_DATA_DIR/data mounted at /data). No privileged mode, host networking, Docker socket, host mounts or
  devices. Network endpoints: HTTP to the miners and nodes the user adds on the local network; optional
  user-configured webhooks; no telemetry. The dashboard trusts requests that arrive through the app proxy
  (MINER_HEARTH_TRUSTED_NETWORKS); it publishes no host port of its own. Automatic miner discovery needs the
  subnet set in Settings because the container is not on the host network. The arm64 image is built by
  QEMU in CI and has not been run on real ARM hardware by the developer; amd64 tested only outside 5tratumOS.
