# Builds the Miner Hearth headless image for linux/amd64 and linux/arm64 and pushes it to
# GitHub Container Registry as ghcr.io/<owner, lowercase>/miner-hearth:<version> (and :latest).
# For the Miner-Hearth organisation that is ghcr.io/miner-hearth/miner-hearth:1.17.1.
# Runs when you push a tag like v1.17.1, or by hand: Actions tab > docker > Run workflow.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -p "test_*.py"
      - name: Image name and version
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/miner-hearth" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # links the package to this repository on GitHub
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
      - name: Image and digest (copy this into the Umbrel store's docker-compose.yml if you pin by digest)
        run: |
          {
            echo "### Miner Hearth image"
            echo ""
            echo "Tag: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pinned (optional, for docker-compose.yml):"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}"
